[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codercheckin"
version = "0.1.0"
description = "NAS-friendly multi-platform check-in automation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests",
    "curl_cffi==0.14.0",
    "python-dotenv",
    "cryptography",
    "croniter",
    "tzdata",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools]
py-modules = [
    "attendance_checkin",
    "checkin_response",
    "checkin_runner",
    "config",
    "deepflood_task",
    "nodeseek_task",
    "qinglong_task",
    "random_delay",
    "run",
    "runtime_log",
    "scheduler",
    "v2ex_task",
]

[tool.setuptools.packages.find]
include = [
    "cookiecloud",
    "deepflood",
    "nodeseek",
    "telegram",
    "v2ex",
]
